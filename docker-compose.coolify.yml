services:
  server:
    image: 'ghcr.io/paulo-atsinformatica/opensignserver:staging'
    container_name: OpenSignServer-container
    volumes:
      - 'opensign-files:/usr/src/app/files'
    expose:
      - '8080'
    depends_on:
      - mongo
    environment:
      - 'NODE_ENV=${NODE_ENV:-production}'
      - 'PORT=${PORT:-8080}'
      - 'DATABASE_URI=${DATABASE_URI:-mongodb://mongo:27017/opensign}'
      - 'MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/opensign}'
      - 'APP_ID=${APP_ID:-opensign}'
      - 'MASTER_KEY=${MASTER_KEY}'
      - 'SERVER_URL=${SERVER_URL}'
      - 'PUBLIC_URL=${PUBLIC_URL}'
      - 'PARSE_MOUNT=${PARSE_MOUNT:-/app}'
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - 'traefik.http.routers.opensign-api.rule=Host(`assinatura.atsinformatica.com.br`) && PathPrefix(`/api`)'
      - traefik.http.routers.opensign-api.entrypoints=http
      - traefik.http.routers.opensign-api.priority=100
      - traefik.http.routers.opensign-api.middlewares=opensign-strip-api
      - 'traefik.http.routers.opensign-api-secure.rule=Host(`assinatura.atsinformatica.com.br`) && PathPrefix(`/api`)'
      - traefik.http.routers.opensign-api-secure.entrypoints=https
      - traefik.http.routers.opensign-api-secure.priority=100
      - traefik.http.routers.opensign-api-secure.tls=true
      - traefik.http.routers.opensign-api-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.opensign-api-secure.middlewares=opensign-strip-api
      - traefik.http.routers.opensign-api-secure.service=opensign-api
      - traefik.http.services.opensign-api.loadbalancer.server.port=8080
      - traefik.http.middlewares.opensign-strip-api.stripPrefix.prefixes=/api
    networks:
      - app-network
      - coolify
    restart: unless-stopped
  mongo:
    image: 'mongo:latest'
    container_name: mongo-container
    volumes:
      - 'data-volume:/data/db'
    expose:
      - '27017'
    networks:
      - app-network
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=opensign
  client:
    image: 'ghcr.io/paulo-atsinformatica/opensign:staging'
    container_name: OpenSign-container
    depends_on:
      - server
    environment:
      - 'REACT_APP_SERVERURL=${REACT_APP_SERVERURL}'
    expose:
      - '3060'
    networks:
      - app-network
      - coolify
    restart: unless-stopped
    labels:
      - coolify.port=3060
      - coolify.expose=true
      - traefik.docker.network=coolify
networks:
  app-network:
    driver: bridge
  coolify:
    external: true
volumes:
  data-volume: null
  opensign-files: null
