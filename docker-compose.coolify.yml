# Docker Compose para Coolify
# Este arquivo usa as imagens do GitHub Container Registry (ghcr.io)
# As imagens são construídas automaticamente via GitHub Actions
# Use este arquivo no Coolify apontando para o repositório GitHub

services:
  server:
    image: ghcr.io/paulo-atsinformatica/opensignserver:staging
    container_name: OpenSignServer-container
    volumes:
      - opensign-files:/usr/src/app/files
    expose:
      - "8080"
    depends_on:
      - mongo
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-8080}
      - DATABASE_URI=${DATABASE_URI}
      - MONGODB_URI=${MONGODB_URI:-${DATABASE_URI}}
      - APP_ID=${APP_ID:-opensign}
      - MASTER_KEY=${MASTER_KEY}
      # URL interna do servidor (sem /api, comunicação interna Docker)
      - SERVER_URL=${SERVER_URL:-http://server:8080/app}
      - PUBLIC_URL=${PUBLIC_URL:-${HOST_URL}}
      - PARSE_MOUNT=${PARSE_MOUNT:-/app}
    labels:
      # Labels Traefik para roteamento da API com prioridade alta
      - "traefik.enable=true"
      - "traefik.http.routers.opensign-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.opensign-api.priority=20"
      - "traefik.http.routers.opensign-api.service=opensign-api"
      - "traefik.http.services.opensign-api.loadbalancer.server.port=8080"
      # Middleware para remover /api antes de enviar para o servidor
      - "traefik.http.middlewares.opensign-strip-api.stripPrefix.prefixes=/api"
      - "traefik.http.routers.opensign-api.middlewares=opensign-strip-api"
      - SMTP_ENABLE=${SMTP_ENABLE:-false}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER_EMAIL=${SMTP_USER_EMAIL}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      - MAILGUN_SENDER=${MAILGUN_SENDER}
      - USE_LOCAL=${USE_LOCAL:-true}
      - DO_ENDPOINT=${DO_ENDPOINT}
      - DO_SPACE=${DO_SPACE}
      - DO_BASEURL=${DO_BASEURL}
      - DO_REGION=${DO_REGION}
      - DO_ACCESS_KEY_ID=${DO_ACCESS_KEY_ID}
      - DO_SECRET_ACCESS_KEY=${DO_SECRET_ACCESS_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FILE_KEY=${FILE_KEY}
    networks:
      - app-network
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: mongo-container
    volumes:
      - data-volume:/data/db
    expose:
      - "27017"
    networks:
      - app-network
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=opensign

  client:
    image: ghcr.io/paulo-atsinformatica/opensign:staging
    container_name: OpenSign-container
    depends_on:
      - server
    environment:
      # URL pública da API (com /api, como visto pelo navegador)
      - REACT_APP_SERVERURL=${REACT_APP_SERVERURL:-${HOST_URL}/api/app}
    expose:
      - "3000"
    networks:
      - app-network
    restart: unless-stopped
    labels:
      - "coolify.port=3000"
      - "coolify.expose=true"
      # Labels Traefik para roteamento do cliente com prioridade baixa
      - "traefik.enable=true"
      - "traefik.http.routers.opensign-web.priority=1"
      - "traefik.http.routers.opensign-web.service=opensign-web"
      - "traefik.http.services.opensign-web.loadbalancer.server.port=3000"

networks:
  app-network:
    driver: bridge

volumes:
  data-volume:
  opensign-files:
