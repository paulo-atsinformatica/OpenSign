# Docker Compose para Coolify
# Este arquivo usa as imagens do GitHub Container Registry (ghcr.io)
# As imagens são construídas automaticamente via GitHub Actions
# Use este arquivo no Coolify apontando para o repositório GitHub

services:
  server:
    image: ghcr.io/paulo-atsinformatica/opensignserver:staging
    container_name: OpenSignServer-container
    volumes:
      - opensign-files:/usr/src/app/files
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-8080}
      - DATABASE_URI=${DATABASE_URI}
      - MONGODB_URI=${MONGODB_URI:-${DATABASE_URI}}
      - APP_ID=${APP_ID:-opensign}
      - MASTER_KEY=${MASTER_KEY}
      - SERVER_URL=${SERVER_URL:-${HOST_URL}/api/app}
      - PUBLIC_URL=${PUBLIC_URL:-${HOST_URL}}
      - PARSE_MOUNT=${PARSE_MOUNT:-/app}
      - SMTP_ENABLE=${SMTP_ENABLE:-false}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER_EMAIL=${SMTP_USER_EMAIL}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      - MAILGUN_SENDER=${MAILGUN_SENDER}
      - USE_LOCAL=${USE_LOCAL:-true}
      - DO_ENDPOINT=${DO_ENDPOINT}
      - DO_SPACE=${DO_SPACE}
      - DO_BASEURL=${DO_BASEURL}
      - DO_REGION=${DO_REGION}
      - DO_ACCESS_KEY_ID=${DO_ACCESS_KEY_ID}
      - DO_SECRET_ACCESS_KEY=${DO_SECRET_ACCESS_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FILE_KEY=${FILE_KEY}
    networks:
      - app-network
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: mongo-container
    volumes:
      - data-volume:/data/db
    ports:
      - "27017:27017"
    networks:
      - app-network
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=opensign

  client:
    image: ghcr.io/paulo-atsinformatica/opensign:staging
    container_name: OpenSign-container
    depends_on:
      - server
    environment:
      - REACT_APP_SERVERURL=${REACT_APP_SERVERURL:-${SERVER_URL:-${HOST_URL}/api/app}}
    ports:
      - "3000:3000"
    networks:
      - app-network
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: caddy-container
    ports:
      - "3001:3001"
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    environment:
      - HOST_URL=${HOST_URL:-localhost:3001}
    restart: unless-stopped
    depends_on:
      - client
      - server

networks:
  app-network:
    driver: bridge

volumes:
  data-volume:
  web-root:
  caddy_data:
  caddy_config:
  opensign-files:
