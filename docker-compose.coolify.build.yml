# Docker Compose para Coolify - Versão com Build Local
# Use esta versão se quiser construir as imagens localmente no Coolify
# Alternativa ao docker-compose.coolify.yml que usa imagens do GHCR
# O Traefik é gerenciado pelo Coolify (não precisa definir aqui)

services:
  server:
    build:
      context: .
      dockerfile: apps/OpenSignServer/Dockerhubfile
    container_name: OpenSignServer-container
    volumes:
      - opensign-files:/usr/src/app/files
    expose:
      - "8080"
    depends_on:
      - mongo
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      # URL pública do servidor (usada para links em emails de reset de senha, etc.)
      - SERVER_URL=${HOST_URL:-https://localhost}/api/app
      - PUBLIC_URL=${HOST_URL:-https://localhost}
    labels:
      # Labels Traefik para roteamento da API com prioridade alta
      - "traefik.enable=true"
      - "traefik.http.routers.opensign-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.opensign-api.entrypoints=websecure"
      - "traefik.http.routers.opensign-api.tls=true"
      - "traefik.http.routers.opensign-api.priority=20"
      - "traefik.http.routers.opensign-api.service=opensign-api"
      - "traefik.http.services.opensign-api.loadbalancer.server.port=8080"
      # Middleware para remover /api antes de enviar para o servidor
      - "traefik.http.middlewares.opensign-strip-api.stripPrefix.prefixes=/api"
      - "traefik.http.routers.opensign-api.middlewares=opensign-strip-api"
    networks:
      - app-network
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: mongo-container
    volumes:
      - data-volume:/data/db
    expose:
      - "27017"
    networks:
      - app-network
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=opensign

  client:
    build:
      context: .
      dockerfile: apps/OpenSign/Dockerhubfile
    container_name: OpenSign-container
    depends_on:
      - server
    env_file: .env.prod
    environment:
      - REACT_APP_SERVERURL=${HOST_URL:-https://localhost}/api/app
    expose:
      - "3000"
    labels:
      # Labels Traefik para roteamento do cliente com prioridade baixa
      - "traefik.enable=true"
      - "traefik.http.routers.opensign-web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.opensign-web.entrypoints=websecure"
      - "traefik.http.routers.opensign-web.tls=true"
      - "traefik.http.routers.opensign-web.priority=1"
      - "traefik.http.routers.opensign-web.service=opensign-web"
      - "traefik.http.services.opensign-web.loadbalancer.server.port=3000"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  data-volume:
  opensign-files:
